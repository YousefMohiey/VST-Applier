[workspace]
members = [
    "crates/vst-host-sys",
    "crates/audio-engine",
    "crates/app-state",
    "crates/vst2-host-dll",
    "crates/vst3-host-dll",
    "crates/ai-denoise",
    "crates/applier-denoise-vst2",
    "crates/applier-eq-vst2",
]
resolver = "2"

[profile.release]
# Shipping profile: full LTO + single codegen unit for the DSP hot
# path. NEVER panic="abort": the engine isolates plugin crashes with
# catch_unwind, which needs unwinding.
lto = true
codegen-units = 1
strip = "symbols"

[package]
name = "vst-applier"
version = "0.4.6"
edition = "2024"

[dependencies]
vst-host-sys = { path = "crates/vst-host-sys" }
audio-engine = { path = "crates/audio-engine" }
ai-denoise = { path = "crates/ai-denoise", default-features = false }
app-state = { path = "crates/app-state" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
raw-window-handle = "0.6"
windows-registry = "0.2"
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
egui-phosphor = "0.9"
ureq = "3.4.2"
zip = "9.0.3"

[build-dependencies]
winres = "0.1.12"

# Vendored cpal 0.15.3 with one fix: the WASAPI capture loop used to
# busy-spin at 100% CPU when GetNextPacketSize/GetBuffer disagreed
# (see vendor/cpal/src/host/wasapi/stream.rs, the AUDCLNT_S_BUFFER_EMPTY
# arm). The spin froze stream teardown (stop/restart hung forever) and
# burned a core while capture went silent. Keep this patch pointed at
# the vendor dir until the fix lands upstream.
[patch.crates-io]
cpal = { path = "vendor/cpal" }

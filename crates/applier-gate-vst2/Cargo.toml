[package]
name = "applier-gate-vst2"
version = "0.4.7"
edition = "2021"
description = "Yousef Gate — a VST2 noise gate (Threshold/Range/Attack/Hold/Release, 4 dB hysteresis) for the VST-Applier chain"
license = "MIT OR Apache-2.0"

[lib]
name = "VSTApplierGate"
crate-type = ["cdylib"]

[dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[package]
name = "applier-denoise-vst2"
version = "0.4.3"
edition = "2021"
description = "VST-Applier AI Denoise — a VST2 plugin wrapping the built-in DeepFilterNet3-ll denoiser"
license = "MIT OR Apache-2.0"

[lib]
name = "VSTApplierDenoise"
crate-type = ["cdylib"]

[dependencies]
ai-denoise = { path = "../ai-denoise" }
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
microseh = "1.2"

[package]
name = "vst2-host-dll"
version = "0.4.6"
edition = "2021"

[lib]
name = "Vst2HostNative"
crate-type = ["cdylib"]

[dependencies]
microseh = "1.2"
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # Rust port of the VST2 host: file probing, FormatMessageW error text,
    # UTF-8 -> UTF-16 conversion of plugin strings.
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_Globalization",
] }

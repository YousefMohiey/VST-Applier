[package]
name = "audio-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
vst-host-sys = { path = "../vst-host-sys" }
ai-denoise = { path = "../ai-denoise" }
cpal = "0.15"
ringbuf = "0.4"
thiserror = "2"
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Security",
] }

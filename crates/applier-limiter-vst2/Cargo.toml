[package]
name = "applier-limiter-vst2"
version = "0.4.6"
edition = "2021"
description = "Applier Limiter — a VST2 peak limiter (Threshold/Release) for the VST-Applier chain"
license = "MIT OR Apache-2.0"

[lib]
name = "VSTApplierLimiter"
crate-type = ["cdylib"]

[dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

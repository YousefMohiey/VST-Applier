[package]
name = "ai-denoise"
version = "0.4.1"
edition = "2021"

[dependencies]
# DFN's Rust inference crate (libDF) with the tract backend and the
# embedded DeepFilterNet3 model (~8 MB baked into the binary) — MIT /
# Apache-2.0. Pinned to a known-good rev; the crates.io release of
# `deep_filter` does not carry the inference module.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = [
    "tract",
    "default-model",
] }
ndarray = "0.15"
# Pin tract to the exact set the DFN repo locks. Newer 0.21.x releases
# changed APIs libDF uses (0.21.10 fails to compile it) — deep_filter
# declares ^0.21.4, so these exact-version entries drag resolution back.
tract-core = "=0.21.4"
tract-hir = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"

[package]
name = "vst3-host-dll"
version = "0.4.2"
edition = "2021"

[lib]
name = "Vst3HostNative"
crate-type = ["cdylib"]

[dependencies]
microseh = "1.2"
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # Rust port of the VST3 host: GetFileAttributesW probe, FormatMessageW
    # error text for LoadLibraryW failures.
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
] }
